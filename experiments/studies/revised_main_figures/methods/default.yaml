# AbDev-X configuration. Column names use candidate-alias lists because the public
# GDPa1 CSV header is resolved at load time (see src/abdev/data/dataset.py::resolve_column).

data:
  hf_repo: "ginkgo-datapoints/GDPa1"
  csv_filename: "GDPa1_v1.2_20250814.csv"   # fallback if --largest disabled
  use_largest_csv: true                      # auto-pick the CSV with the most antibodies
  aggregate_replicates: true                 # if table is tidy/long, average per antibody
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  # Identifier + sequence columns (alias candidates, first match wins, case-insensitive).
  # We use the variable-domain (VH/VL) sequences: ideal for antibody PLMs (AbLang2) and CDR numbering.
  id_aliases: ["antibody_name", "antibody_id", "Antibody Name", "name", "id"]
  heavy_aliases: ["vh_protein_sequence", "heavy_chain", "VH", "hc_protein_sequence", "heavy"]
  light_aliases: ["vl_protein_sequence", "light_chain", "VL", "lc_protein_sequence", "light"]

  # Official cross-validation fold columns shipped with GDPa1.
  fold_aliases:
    random: ["random_fold"]
    cluster: ["hierarchical_cluster_fold"]
    cluster_isotype: ["hierarchical_cluster_IgG_isotype_stratified_fold"]
  primary_fold: "cluster_isotype"   # the column Ginkgo recommends for reporting

# The five competition-scored properties. `column` is an alias list; `direction` is the
# sign of "more developable" (used only for reporting, not for scoring).
targets:
  HIC:
    column: ["HIC", "HIC_retention_time", "Hydrophobicity", "HIC Retention Time"]
    direction: lower
  PR_CHO:
    column: ["PR_CHO", "Polyreactivity_CHO", "PolyReactivity_CHO", "Poly-Specificity_CHO", "PR-CHO"]
    direction: lower
  AC-SINS_pH7.4:
    column: ["AC-SINS_pH7.4", "AC-SINS pH7.4", "ACSINS_pH7.4", "Self-association_AC-SINS_pH7.4"]
    direction: lower
  Tm2:
    column: ["Tm2", "Thermostability_Tm2", "Tm2_C", "Tm2 (C)"]
    direction: higher
  Titer:
    column: ["Titer", "Titer_mg_L", "Expression_Titer", "Titer (mg/L)"]
    direction: higher

# Auxiliary multi-task targets (modeled jointly, not scored). Loaded if present.
# Real GDPa1 v1.2 columns used to enrich the shared multi-task trunk.
aux_targets:
  column_aliases:
    - ["Purity"]
    - ["SEC %Monomer"]
    - ["SMAC"]
    - ["HAC"]
    - ["PR_Ova"]
    - ["AC-SINS_pH6.0"]
    - ["Tonset"]
    - ["Tm1"]

features:
  use_descriptors: true
  use_esm2: true
  use_ablang2: true     # antibody-specific PLM; falls back gracefully if unavailable
  esm2_model: "facebook/esm2_t33_650M_UR50D"
  ph: 7.4               # for charge/descriptor computation
  pool: ["mean", "cdr"] # embedding pooling strategies to concatenate

model:
  heads: ["ridge", "lgbm", "multitask_mlp"]
  stacking: true
  standardize_targets: true   # fit transform in-fold only
  random_state: 42

eval:
  metric: "spearman"
  report_folds: ["cluster_isotype", "cluster", "random"]
  results_dir: "results"
