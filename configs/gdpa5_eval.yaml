# GDPa5 VHH-Fc evaluation.
# 160 clinical VHH-Fc antibodies. No light chain.
# in_model_cohort=Yes (100) were used in GDPa5's own internal model — exclude for
# unbiased evaluation and use only in_model_cohort=No (60) as true held-out.
# NOTE: out-of-distribution test (AbDev-X trained on standard IgGs).

data:
  hf_repo: "ginkgo-datapoints/GDPa1"
  csv_filename: "GDPa1_v1.2_20250814.csv"
  use_largest_csv: true
  aggregate_replicates: true
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  id_aliases: ["antibody_name", "name", "id"]
  heavy_aliases: ["vh_protein_sequence", "VH", "vh", "vhn", "heavy_chain", "heavy"]
  light_aliases: ["vl_protein_sequence", "VL", "vl", "light_chain", "light"]

  fold_aliases:
    random: ["random_fold"]
    cluster: ["hierarchical_cluster_fold"]
    cluster_isotype: ["hierarchical_cluster_IgG_isotype_stratified_fold"]
  primary_fold: "cluster_isotype"

heldout:
  csv_path: "data/processed/gdpa5.csv"
  id_aliases: ["antibody_name", "name", "id"]
  heavy_aliases: ["vhn", "vh_protein_sequence", "VH", "vh", "heavy"]
  light_aliases: ["vl", "vl_protein_sequence", "VL", "light"]
  targets:
    HIC:
      column: ["HIC", "hic_rt_avg"]
      direction: lower
    Tm2:
      column: ["Tm2", "tm2_nanodsf_avg"]
      direction: higher
    AC-SINS_pH7.4:
      column: ["AC-SINS", "acsins_dLmax_ph7.4_avg", "AC-SINS_pH7.4"]
      direction: lower
    PR_CHO:
      column: ["PR_CHO", "polyreactivity_prscore_cho_avg"]
      direction: lower

targets:
  HIC:
    column: ["HIC", "HIC_retention_time"]
    direction: lower
  PR_CHO:
    column: ["PR_CHO"]
    direction: lower
  AC-SINS_pH7.4:
    column: ["AC-SINS_pH7.4", "AC-SINS pH7.4"]
    direction: lower
  Tm2:
    column: ["Tm2", "Thermostability_Tm2"]
    direction: higher
  Titer:
    column: ["Titer"]
    direction: higher

features:
  use_descriptors: true
  use_esm2: true
  use_ablang2: true
  esm2_model: "facebook/esm2_t33_650M_UR50D"
  ph: 7.4
  pool: ["mean", "cdr"]

model:
  heads: ["ridge", "lgbm", "multitask_mlp"]
  stacking: true
  standardize_targets: true
  random_state: 42

eval:
  metric: "spearman"
  results_dir: "results"
  n_bootstrap: 1000
  bootstrap_seed: 42
